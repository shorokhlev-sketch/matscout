name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install deps
        run: uv sync --extra dev

      - name: Ruff (lint)
        run: uv run ruff check matscout tests

      - name: Ruff (format)
        run: uv run ruff format --check matscout tests

      - name: Mypy
        run: uv run mypy matscout

      - name: Pytest (offline only — `live` marker is auto-skipped without keys)
        run: uv run pytest -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push) — verifies Dockerfile stays green
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: matscout:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
